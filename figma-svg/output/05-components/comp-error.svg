em bản lưu</text><rect x="40" y="446" width="280" height="60" rx="12" fill="#F5F2E7"/><g transform="translate(56,466) scale(0.8333333333333334)" fill="none" stroke="#756534" stroke-width="2.280" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></g><text x="84" y="472" font-family="Inter" font-size="12" font-weight="600" fill="#756534" text-anchor="start">Thử lại tối đa 3 lần</text><text x="84" y="490" font-family="Inter" font-size="11" font-weight="500" fill="#756534" text-anchor="start">Sau đó tự chuyển sang bản lưu.</text></svg>