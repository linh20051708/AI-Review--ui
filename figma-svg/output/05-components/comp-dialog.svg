<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><rect x="0" y="0" width="360" height="640" rx="0" fill="#FAFBFA"/><text x="40" y="64" font-family="Inter" font-size="22" font-weight="700" fill="#24332D" text-anchor="start">Dialog</text><line x1="40" y1="84" x2="320" y2="84" stroke="#E1E7E3" stroke-width="1"/><text x="40" y="108" font-family="Inter" font-size="14" font-weight="400" fill="#66736D" text-anchor="start">Hộp thoại xác nhận + banner cảnh báo</text><text x="40" y="154" font-family="Inter" font-size="16" font-weight="600" fill="#24332D" text-anchor="start">Hộp thoại xác nhận phê duyệt</text><rect x="0" y="154" width="360" height="300" rx="0" fill="#24332D" opacity="0.35"/><rect x="20" y="178" width="320" height="240" rx="16" fill="#FFFFFF"/><circle cx="180.0" cy="222" r="24" fill="#EAF4ED"/><g transform="translate(168.0,210) scale(1.0)" fill="none" stroke="#146B55" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 5-5"/></g><text x="180.0" y="274" font-family="Inter" font-size="16" font-weight="600" fill="#24332D" text-anchor="middle">Phê duyệt tài liệu?</text><text x="180.0" y="298" font-family="Inter" font-size="13" font-weight="400" fill="#66736D" text-anchor="middle">Tài liệu sẽ được đánh dấu Đã phê duyệt</text><text x="180.0" y="316" font-family="Inter" font-size="13" font-weight="400" fill="#66736D" text-anchor="middle">và mở khóa các mục phụ thuộc.</text><rect x="36" y="354" width="138.0" height="44" rx="8" fill="#FFFFFF" stroke="#E1E7E3" stroke-width="1"/><text x="105.0" y="381" font-family="Inter" font-size="14" font-weight="600" fill="#146B55" text-anchor="middle">Hủy</text><rect x="190.0" y="354" width="138.0" height="44" rx="8" fill="#146B55"/><text x="259.0" y="381" font-family="Inter" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Phê duyệt</text><text x="40" y="438" font-family="Inter" font-size="11" font-weight